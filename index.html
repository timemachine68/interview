<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ฝึกสัมภาษณ์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7fb;--card:#fff;--ink:#1d2433;--mute:#5d6678;--line:#e3e6ee;
  --brand:#2f5bea;--brand-ink:#fff;--ok:#16794a;--ok-bg:#e4f5ec;--warn:#9a5b00;--warn-bg:#fff3d9;--bad:#b3261e;--bad-bg:#fdeceb;--chip:#eef1fb;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#12151c;--card:#1b2030;--ink:#eef0f6;--mute:#a4abbd;--line:#2c3348;--brand:#7c9bff;--brand-ink:#0b1022;--ok:#6fd6a3;--ok-bg:#16301f;--warn:#f1c36b;--warn-bg:#352a10;--bad:#ff9d96;--bad-bg:#3a1b19;--chip:#252c44}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "Noto Sans Thai",system-ui,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:.2em 0}
h2{font-size:1.15rem;margin:.2em 0 .5em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
.mute{color:var(--mute);font-size:.92rem}
label{display:block;font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:220px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 45%,transparent);outline-offset:1px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 16px;min-height:44px}
button.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:600}
button.link{border:0;background:none;color:var(--brand);padding:6px 4px;min-height:0;text-decoration:underline}
button.danger{color:var(--bad);border-color:var(--bad)}
button:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{flex:0 0 auto}
.grow{flex:1 1 160px !important}
.tabs{display:flex;gap:6px;margin:0 0 14px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:2}
.tabs button{flex:1;border-radius:999px}
.tabs button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:600}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:1px 10px;font-size:.82rem;margin:2px 4px 2px 0}
.qitem{display:block;width:100%;text-align:left;margin:0 0 8px;padding:12px 14px;border-radius:12px;min-height:0}
.qitem .t{font-weight:600}
.msg{padding:10px 14px;border-radius:10px;margin:10px 0}
.msg.err{background:var(--bad-bg);color:var(--bad)}
.msg.ok{background:var(--ok-bg);color:var(--ok)}
.msg.warn{background:var(--warn-bg);color:var(--warn)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:560px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--chip);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.35rem}
.bar{height:10px;background:var(--chip);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brand)}
.score{font-size:2.6rem;font-weight:700;line-height:1.1}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.rate{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rate button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.q{font-size:1.2rem;font-weight:600}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pre{white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
.sr{position:absolute;left:-9999px}
.chk{display:flex;gap:10px;align-items:flex-start;margin:10px 0;font-weight:400}
.chk input{width:22px;height:22px;margin-top:3px;flex:0 0 22px}
footer{text-align:center;margin:24px 0 8px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);max-width:640px;width:calc(100% - 24px);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.5)}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>

const CONTACT = "timemachine68@gmail.com";                 // ใส่อีเมล/ช่องทางติดต่อ (ใช้ในข้อความขอลบบัญชี)

const app = document.getElementById("app");
const S = {user:null, profile:null, recovery:false, cat:null, tab:"practice",
  f:{cat:"",level:"",q:"",lang:"",show:PAGE}, hist:{rows:[],done:false,loading:false,open:{}}, p:null};

/* ===== ตัวช่วย ===== */
function h(tag, props, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(props||{})){
    if(k==="class") e.className=v;
    else if(k.startsWith("on")) e.addEventListener(k.slice(2),v);
    else if(v===true) e.setAttribute(k,"");
    else if(v!==false && v!=null) e.setAttribute(k,v);
  }
  for(const c of kids.flat()){ if(c==null||c===false) continue; e.append(c.nodeType?c:document.createTextNode(String(c))); }
  return e;
}
function mount(...nodes){ app.replaceChildren(...nodes.flat(Infinity).filter(Boolean)); window.scrollTo(0,0); }
function msg(kind,text){ return h("div",{class:"msg "+kind,role:kind==="err"?"alert":"status"},text); }
function fmtTime(s){ s=Math.max(0,Math.round(s)); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); }
function fmtDate(iso){ try{return new Date(iso).toLocaleString("th-TH",{dateStyle:"medium",timeStyle:"short"});}catch(e){return "";} }
function uuid(){ return (crypto.randomUUID?crypto.randomUUID():"10000000-1000-4000-8000-100000000000".replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16))); }

function friendly(e, fallback){
  const m=(e&&e.message)||"";
  if(/[ก-๙]/.test(m)) return m;                       // ข้อความไทยจากระบบเราเอง
  if(/Invalid login/i.test(m)) return "อีเมลหรือรหัสผ่านไม่ถูกต้อง ตรวจอีกครั้ง หรือกด “ลืมรหัสผ่าน”";
  if(/Email not confirmed/i.test(m)) return "ยังไม่ได้ยืนยันอีเมล เปิดอีเมลของคุณแล้วกดลิงก์ยืนยันก่อน (ดูในจดหมายขยะด้วย)";
  if(/already registered|already been registered/i.test(m)) return "อีเมลนี้สมัครไว้แล้ว ลองเข้าสู่ระบบ หรือกด “ลืมรหัสผ่าน”";
  if(/rate limit|too many|security purposes/i.test(m)) return "ทำรายการถี่เกินไป กรุณารอสักครู่ (ประมาณ 1 นาที) แล้วลองใหม่";
  if(/Password should|weak/i.test(m)) return "รหัสผ่านง่ายเกินไป ใช้อย่างน้อย 8 ตัวอักษร และไม่ใช้รหัสที่เดาง่าย";
  if(/valid email|invalid.*email/i.test(m)) return "รูปแบบอีเมลไม่ถูกต้อง ตรวจอีกครั้ง";
  if(/fetch|network|Failed to/i.test(m)) return "เชื่อมต่ออินเทอร์เน็ตไม่ได้ ตรวจสัญญาณแล้วลองใหม่";
  if(e && e.code==="42501") return "คุณไม่มีสิทธิ์ทำรายการนี้ ลองออกจากระบบแล้วเข้าใหม่";
  return fallback||"เกิดข้อผิดพลาด ลองอีกครั้ง ถ้ายังไม่ได้ให้ออกจากระบบแล้วเข้าใหม่";
}

/* ===== เงื่อนไข ===== */
const TERMS_TEXT = [
 ["เงื่อนไขการใช้งาน (เวอร์ชัน "+TERMS_VERSION+")",[
  "ระบบนี้ใช้ฝึกซ้อมสัมภาษณ์เท่านั้น คะแนนเป็นเพียงตัวช่วยเบื้องต้น ไม่ใช่ผลสอบจริง และไม่รับรองว่าจะสอบผ่าน",
  "ใช้งานได้ฟรี การเลี้ยงกาแฟเป็นความสมัครใจ และไม่ได้ซื้อสิทธิ์พิเศษ",
  "ห้ามพิมพ์ข้อมูลส่วนตัวของผู้อื่น ความลับ หรือข้อความที่ผิดกฎหมายลงในคำตอบ",
  "ปุ่ม “คัดลอก prompt” เพียงคัดลอกข้อความให้คุณนำไปวางใน AI ที่คุณใช้เอง ระบบนี้ไม่ได้ส่งคำตอบของคุณไปให้ AI ใด ๆ ข้อความที่คุณวางต่อจะอยู่ภายใต้เงื่อนไขของผู้ให้บริการ AI นั้น",
  "ผู้ดูแลอาจปรับปรุงระบบหรือเงื่อนไข ถ้ามีการเปลี่ยนเงื่อนไข ระบบจะขอให้คุณยอมรับใหม่"]],
 ["นโยบายความเป็นส่วนตัว",[
  "ข้อมูลที่เก็บ: อีเมล (ใช้เข้าสู่ระบบ), ชื่อที่แสดง, ระดับการศึกษา, คำตอบที่คุณพิมพ์ฝึก, คะแนน, เวลาที่ใช้ และวันเวลาที่ฝึก",
  "ใช้เพื่อแสดงประวัติการซ้อมของคุณเองเท่านั้น ผู้ใช้คนอื่นมองไม่เห็นข้อมูลของคุณ ไม่ขายและไม่ส่งต่อข้อมูลให้ผู้อื่น",
  "คุณลบประวัติการซ้อมของตัวเองได้ทุกเมื่อในหน้า “ประวัติ”",
  "ต้องการลบบัญชี ให้ติดต่อผู้ดูแล"+(CONTACT?" ที่ "+CONTACT:"")+" ข้อมูลทั้งหมดของคุณจะถูกลบตามบัญชี",
  "ผู้ดูแลระบบเข้าถึงฐานข้อมูลในทางเทคนิคได้ แต่จะไม่เปิดดูคำตอบของคุณ เว้นแต่จำเป็นต้องแก้ไขปัญหาของระบบ"]]
];
function showTerms(){
  const d=document.getElementById("dlg");
  d.replaceChildren(
    ...TERMS_TEXT.flatMap(([t,items])=>[h("h2",{},t),h("ul",{},items.map(i=>h("li",{},i)))]),
    h("div",{class:"row"},h("button",{class:"primary",onclick:()=>d.close()},"ปิด")));
  d.showModal();
}

/* ===== เส้นทางหลัก ===== */
async function route(){
  try{
    if(S.recovery) return viewRecover();
    const {data:{session}} = await sb.auth.getSession();
    S.user = session ? session.user : null;
    if(!S.user) return viewAuth();
    const [pr, cs] = await Promise.all([
      sb.from("profiles").select("display_name,education_level").eq("id",S.user.id).maybeSingle(),
      sb.from("consents").select("consent_type").eq("version",TERMS_VERSION).limit(10)
    ]);
    if(pr.error) throw pr.error; if(cs.error) throw cs.error;
    S.profile = pr.data || {display_name:"ผู้ใช้ใหม่",education_level:null};
    const types=new Set((cs.data||[]).map(r=>r.consent_type));
    if(!(types.has("terms")&&types.has("privacy")) || !S.profile.education_level) return viewGate(types);
    if(!S.cat) await loadCatalog();
    if(S.p) return viewPractice();
    viewHome();
  }catch(e){
    mount(h("div",{class:"card"},h("h1",{},"โหลดไม่สำเร็จ"),msg("err",friendly(e,"โหลดข้อมูลไม่สำเร็จ ตรวจอินเทอร์เน็ตแล้วกดลองใหม่")),
      h("button",{class:"primary",onclick:route},"ลองใหม่")));
  }
}
sb.auth.onAuthStateChange((ev)=>{
  if(ev==="PASSWORD_RECOVERY") S.recovery=true;
  if(ev==="SIGNED_OUT"){ S.user=null; S.cat=null; S.p=null; S.hist={rows:[],done:false,loading:false,open:{}}; }
  if(ev==="SIGNED_IN"||ev==="SIGNED_OUT"||ev==="PASSWORD_RECOVERY") setTimeout(route,0);
});

/* ===== สมัคร / เข้าสู่ระบบ ===== */
function viewAuth(mode="login", note=null){
  const em=h("input",{type:"email",id:"em",autocomplete:"email",required:true,placeholder:"name@example.com"});
  const pw=h("input",{type:"password",id:"pw",autocomplete:mode==="login"?"current-password":"new-password",required:true,minlength:"8"});
  const nm=h("input",{type:"text",id:"nm",maxlength:"50",autocomplete:"nickname",placeholder:"ชื่อเล่นหรือชื่อที่อยากให้เรียก"});
  const out=h("div"); if(note) out.append(note);
  const btn=h("button",{class:"primary",type:"submit"},mode==="login"?"เข้าสู่ระบบ":"สมัครใช้งาน");
  const form=h("form",{onsubmit:async(ev)=>{
    ev.preventDefault(); out.replaceChildren();
    const email=em.value.trim(), pass=pw.value;
    if(!email) return out.append(msg("err","กรุณากรอกอีเมล"));
    if(pass.length<8) return out.append(msg("err","รหัสผ่านต้องยาวอย่างน้อย 8 ตัวอักษร"));
    btn.disabled=true;
    try{
      if(mode==="login"){
        const {error}=await sb.auth.signInWithPassword({email,password:pass}); if(error) throw error;
      }else{
        const name=nm.value.trim().slice(0,50);
        if(!name){ btn.disabled=false; return out.append(msg("err","กรุณากรอกชื่อที่แสดง")); }
        const {data,error}=await sb.auth.signUp({email,password:pass,options:{data:{display_name:name},emailRedirectTo:location.origin+location.pathname}});
        if(error) throw error;
        if(data.user && data.user.identities && data.user.identities.length===0) throw new Error("already registered");
        if(!data.session){ btn.disabled=false; return viewAuth("login",msg("ok","สมัครสำเร็จ ส่งอีเมลยืนยันไปที่ "+email+" แล้ว กดลิงก์ในอีเมล (ดูในจดหมายขยะด้วย) จากนั้นกลับมาเข้าสู่ระบบ")); }
      }
    }catch(e){ out.append(msg("err",friendly(e))); }
    btn.disabled=false;
  }},
    mode==="register"&&[h("label",{for:"nm"},"ชื่อที่แสดง"),nm],
    h("label",{for:"em"},"อีเมล"),em,
    h("label",{for:"pw"},"รหัสผ่าน (อย่างน้อย 8 ตัวอักษร)"),pw,
    out,h("div",{class:"row",style:"margin-top:14px"},btn,
      mode==="login"&&h("button",{type:"button",class:"link",onclick:()=>forgot(em.value.trim(),out)},"ลืมรหัสผ่าน")));
  mount(h("div",{class:"card"},
    h("h1",{},"ฝึกสัมภาษณ์"),
    h("p",{class:"mute"},"ซ้อมตอบคำถามสัมภาษณ์ด้วยการพิมพ์ ตรวจคำตอบเบื้องต้นให้ทันที และดูพัฒนาการของตัวเอง"),
    h("div",{class:"tabs"},
      h("button",{class:mode==="login"?"on":"",onclick:()=>viewAuth("login")},"เข้าสู่ระบบ"),
      h("button",{class:mode==="register"?"on":"",onclick:()=>viewAuth("register")},"สมัครใหม่")),
    form),
    DONATE_URL&&h("footer",{},h("a",{href:DONATE_URL},"☕ เลี้ยงกาแฟผู้สร้าง")));
}
async function forgot(email,out){
  out.replaceChildren();
  if(!email) return out.append(msg("warn","พิมพ์อีเมลในช่องด้านบนก่อน แล้วกด “ลืมรหัสผ่าน” อีกครั้ง"));
  const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
  out.append(error?msg("err",friendly(error)):msg("ok","ถ้าอีเมลนี้สมัครไว้ ระบบส่งลิงก์ตั้งรหัสผ่านใหม่ให้แล้ว (ดูในจดหมายขยะด้วย)"));
}
function viewRecover(){
  const pw=h("input",{type:"password",minlength:"8",required:true,autocomplete:"new-password"});
  const out=h("div");
  mount(h("div",{class:"card"},h("h1",{},"ตั้งรหัสผ่านใหม่"),
    h("form",{onsubmit:async(ev)=>{ev.preventDefault(); out.replaceChildren();
      if(pw.value.length<8) return out.append(msg("err","รหัสผ่านต้องยาวอย่างน้อย 8 ตัวอักษร"));
      const {error}=await sb.auth.updateUser({password:pw.value});
      if(error) return out.append(msg("err",friendly(error)));
      S.recovery=false; route();}},
      h("label",{},"รหัสผ่านใหม่"),pw,out,h("div",{style:"margin-top:14px"},h("button",{class:"primary",type:"submit"},"บันทึกรหัสผ่านใหม่")))));
}

/* ===== ตั้งค่าครั้งแรก + ยอมรับเงื่อนไข ===== */
function viewGate(have){
  const lv=h("select",{id:"lv"},h("option",{value:""},"— เลือก —"),
    ["ม.4","ม.5","ม.6","ปวช.","ปริญญาตรี","ทำงานแล้ว","อื่นๆ"].map(x=>h("option",{value:x,selected:S.profile.education_level===x},x)));
  const c1=h("input",{type:"checkbox",id:"c1"}), c2=h("input",{type:"checkbox",id:"c2"});
  const out=h("div"); const btn=h("button",{class:"primary"},"ยืนยันและเริ่มใช้งาน");
  btn.onclick=async()=>{
    out.replaceChildren();
    if(!lv.value) return out.append(msg("err","กรุณาเลือกระดับการศึกษา"));
    if(!c1.checked||!c2.checked) return out.append(msg("err","กรุณาติ๊กยอมรับทั้งเงื่อนไขการใช้งานและนโยบายความเป็นส่วนตัว"));
    btn.disabled=true;
    try{
      const r=await sb.from("profiles").update({education_level:lv.value}).eq("id",S.user.id); if(r.error) throw r.error;
      const rows=["terms","privacy"].filter(t=>!have.has(t)).map(t=>({user_id:S.user.id,consent_type:t,version:TERMS_VERSION}));
      if(rows.length){ const c=await sb.from("consents").insert(rows); if(c.error && c.error.code!=="23505") throw c.error; }
      route();

/* ===== ตรวจกติกา (คำนวณในเครื่อง ไม่ส่งไป AI) ===== */
const norm=s=>s.toLowerCase().replace(/\s+/g,"");
function ruleCheck(q,text){
  const t=text.trim(), n=[...t].length, min=q.min_chars||150, max=q.max_chars||1200, en=q.language==="en";
  let sLen = n<min ? 40*n/min : n<=max ? 40 : 40*Math.max(.5,max/n);
  const kws=q.keywords||[], nt=norm(t);
  const matched=kws.filter(k=>nt.includes(norm(k))), missing=kws.filter(k=>!matched.includes(k));
  const need=Math.max(1,Math.ceil(kws.length*.6));
  const sKw = kws.length? 40*Math.min(1,matched.length/need) : 40;
  const chunks = en ? t.split(/[\n.!?]+/).filter(x=>x.trim().length>=20)
                    : t.split(/[\n.!?\s]+/).filter(x=>x.length>=12);
  const marks = en ? /because|for example|for instance|such as|therefore|so that/i : /เพราะ|เนื่องจาก|ดังนั้น|เช่น|ตัวอย่าง|ทำให้|เพื่อ/;
  const stA = chunks.length>=3?10:chunks.length===2?5:0, stB = marks.test(t)?10:0;
  let score = sLen+sKw+stA+stB, flag="";
  const sh=[]; for(let i=0;i+5<=nt.length;i++) sh.push(nt.slice(i,i+5));
  if(sh.length>20 && new Set(sh).size/sh.length<.5){ score=Math.min(score,20); flag="repeat"; }
  const letters=(t.match(/\p{L}/gu)||[]).length;
  if(n>0 && letters/n<.5){ score=Math.min(score,10); flag="symbols"; }
  score=Math.round(Math.max(0,Math.min(100,score)));
  return {score,n,min,max,matched,missing,flag,parts:{len:Math.round(sLen),kw:Math.round(sKw),st:stA+stB},hasKw:kws.length>0,hasMark:stB>0,chunks:chunks.length};
}

  });
  return [
    H.rows.length===0&&!H.loading?(H.done?h("div",{class:"card"},h("p",{},"ยังไม่มีประวัติ เริ่มซ้อมข้อแรกได้ที่แท็บ “ฝึกตอบ”"),h("button",{class:"primary",onclick:()=>{S.tab="practice";viewHome();}},"ไปเลือกคำถาม")):null):null,
    items,
    H.loading?h("p",{class:"mute"},"กำลังโหลด..."):null,
    !H.done&&H.rows.length>0&&!H.loading?h("button",{onclick:loadHistory},"แสดงเพิ่ม"):null,
    H.err?msg("err",H.err):null];
}
async function loadHistory(){
  const H=S.hist; if(H.loading||H.done) return; H.loading=true; H.err=null; if(S.tab==="history") viewHome();
  let q=sb.from("my_practice_history").select("id,question_snapshot,answer_chars,elapsed_seconds,rule_score,self_score,created_at")
    .order("created_at",{ascending:false}).order("id",{ascending:false}).limit(PAGE+1);
  const last=H.rows[H.rows.length-1];
  if(last) q=q.or('created_at.lt."'+last.created_at+'",and(created_at.eq."'+last.created_at+'",id.lt.'+last.id+')');
  const {data,error}=await q; H.loading=false;
  if(error){ H.err=friendly(error,"โหลดประวัติไม่สำเร็จ กดแท็บ “ประวัติ” อีกครั้ง"); }
  else{ if(data.length>PAGE){H.rows.push(...data.slice(0,PAGE));} else {H.rows.push(...data);H.done=true;} }
  if(S.tab==="history") viewHome();
}
async function toggleAnswer(id){
  const H=S.hist;
  if(H.open[id]){ delete H.open[id]; return viewHome(); }
  H.open[id]={text:null}; viewHome();
  const {data,error}=await sb.from("practice_sessions").select("answer_text").eq("id",id).maybeSingle();
  H.open[id]=error||!data?{err:friendly(error,"เปิดคำตอบไม่ได้ ลองใหม่")}:{text:data.answer_text};
  viewHome();
}
async function delSession(id){
  if(!confirm("ลบการซ้อมนี้ถาวรใช่ไหม? ลบแล้วกู้คืนไม่ได้")) return;
  const {error}=await sb.from("practice_sessions").delete().eq("id",id);
  if(error){ S.hist.err=friendly(error,"ลบไม่สำเร็จ ลองใหม่"); return viewHome(); }
  S.hist.rows=S.hist.rows.filter(r=>r.id!==id); delete S.hist.open[id]; viewHome();
}

/* ===== ของฉัน ===== */
function tabMe(){
  const nm=h("input",{type:"text",maxlength:"50",value:S.profile.display_name||""});
  const lv=h("select",{},["ม.4","ม.5","ม.6","ปวช.","ปริญญาตรี","ทำงานแล้ว","อื่นๆ"].map(x=>h("option",{value:x,selected:S.profile.education_level===x},x)));
  const out=h("div");
  return [h("div",{class:"card"},h("h2",{},"ข้อมูลของฉัน"),
    h("label",{},"ชื่อที่แสดง"),nm,h("label",{},"ระดับการศึกษา"),lv,
    h("label",{},"อีเมล"),h("div",{class:"mute"},S.user.email),out,
    h("div",{class:"row",style:"margin-top:12px"},h("button",{class:"primary",onclick:async()=>{
      out.replaceChildren(); const name=nm.value.trim();
      if(!name) return out.append(msg("err","ชื่อที่แสดงห้ามว่าง"));
      const {error}=await sb.from("profiles").update({display_name:name.slice(0,50),education_level:lv.value}).eq("id",S.user.id);
      if(error) return out.append(msg("err",friendly(error,"บันทึกไม่สำเร็จ ลองใหม่")));
      S.profile.display_name=name.slice(0,50); S.profile.education_level=lv.value; out.append(msg("ok","บันทึกแล้ว"));
    }},"บันทึก"))),
    h("div",{class:"card"},h("h2",{},"เอกสารและความเป็นส่วนตัว"),
      h("button",{onclick:showTerms},"อ่านเงื่อนไขและนโยบาย"),
      h("p",{class:"mute"},"ต้องการลบบัญชีและข้อมูลทั้งหมด ให้ติดต่อผู้ดูแล"+(CONTACT?" ที่ "+CONTACT:"")+" (คุณลบประวัติการซ้อมเองได้ในแท็บ “ประวัติ”)"))];
}

route();
</script>
