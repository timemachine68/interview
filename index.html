:root{
  --bg:#F3EFFC;--card:#fff;--ink:#2B1F5C;--mute:#5B5380;--line:#E0D7F7;
  --brand:#4B2E83;--brand-dk:#2F1B5C;--brand-ink:#fff;--acc:#FFD43B;--acc-ink:#3A2A00;
  --ok:#14663F;--ok-bg:#E6F5EC;--warn:#7A5200;--warn-bg:#FFF3BF;--bad:#B3261E;--bad-bg:#FDECEB;--chip:#F1ECFD;
  --grad:linear-gradient(180deg,#FFF3BF 0,#EDE6FB 360px,#F8F5FF 100%);
  --field-line:#7D70A6;
  --hero-bg:linear-gradient(135deg,#4B2E83 0%,#6A45B5 100%);--hero-ink:#fff;--hero-mute:#DCD2F5;
  color-scheme:light;
}

*{box-sizing:border-box}
body{margin:0;background:var(--grad) no-repeat var(--bg);min-height:100vh;color:var(--ink);font:16px/1.65 "Noto Sans Thai",system-ui,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:16px}
h1,h2,.q,.score,.timer,.brandname{font-family:"Prompt","Noto Sans Thai",sans-serif}
h1{font-size:1.4rem;margin:.2em 0}
h2{font-size:1.15rem;margin:.2em 0 .5em}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin:0 0 14px;box-shadow:0 2px 12px rgba(75,46,131,.08)}
.mute{color:var(--mute);font-size:.92rem}
label{display:block;font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--field-line);border-radius:10px;padding:10px 12px}
textarea{min-height:220px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 45%,transparent);outline-offset:1px}
button{font:inherit;cursor:pointer;border-radius:14px;border:1px solid var(--field-line);background:var(--card);color:var(--ink);padding:10px 16px;min-height:44px}
button.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:600;box-shadow:0 4px 0 var(--brand-dk)}
button.primary:active{transform:translateY(2px);box-shadow:0 2px 0 var(--brand-dk)}
button.primary:disabled{box-shadow:none}
button.link{border:0;background:none;color:var(--brand);padding:6px 4px;min-height:0;text-decoration:underline}
button.danger{color:var(--bad);border-color:var(--bad)}
button:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{flex:0 0 auto}
.grow{flex:1 1 160px !important}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px;position:sticky;top:0;background:transparent;backdrop-filter:blur(6px);padding:8px 0;z-index:2}
.tabs button{flex:1 1 auto;min-width:0;border-radius:999px;font-size:.9rem;padding:8px 8px;white-space:nowrap}
.tabs button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:600}
.chip{display:inline-block;color:var(--ink);background:var(--chip);border-radius:999px;padding:1px 10px;font-size:.82rem;margin:2px 4px 2px 0}
.qitem{display:block;width:100%;text-align:left;margin:0 0 8px;padding:12px 14px;border-radius:12px;min-height:0;border-color:var(--line)}
.qitem .t{font-weight:600}
.msg{padding:10px 14px;border-radius:10px;margin:10px 0}
.msg.err{background:var(--bad-bg);color:var(--bad)}
.msg.ok{background:var(--ok-bg);color:var(--ok)}
.msg.warn{background:var(--warn-bg);color:var(--warn)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:560px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--chip);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.35rem}
.bar{height:10px;background:var(--chip);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:6px}
.score{font-size:2.8rem;font-weight:700;line-height:1.1;color:var(--brand)}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.rate{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rate button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:700}
.badge{display:inline-block;background:var(--acc);color:var(--acc-ink);font-weight:600;font-size:.9rem;border-radius:999px;padding:4px 14px}
.hero h1{font-size:2.1rem;line-height:1.25;margin:.3em 0}
.hero h1 em{font-style:normal;color:var(--brand)}
.hero p{color:var(--mute);margin:.2em 0 .8em}
.feat{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 14px;margin:0 0 8px}
.feat b{font-family:"Prompt","Noto Sans Thai",sans-serif}
.stat{background:var(--chip)}
.site-foot{text-align:center;color:var(--mute);font-size:.9rem;padding-top:0;padding-bottom:28px}
.site-foot a{color:var(--brand)}
.wave{display:block;width:100%;height:36px;margin-top:8px}
.q{font-size:1.2rem;font-weight:600}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pre{white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
.sr{position:absolute;left:-9999px}
.chk{display:flex;gap:10px;align-items:flex-start;margin:10px 0;font-weight:400}
.chk input{width:22px;height:22px;margin-top:3px;flex:0 0 22px}
footer{text-align:center;margin:24px 0 8px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);max-width:640px;width:calc(100% - 24px);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.5)}
/* แถบเลือกโหมดสว่าง/มืด */
.topbar{display:flex;justify-content:flex-end;align-items:center;gap:6px;flex-wrap:wrap;padding:10px 16px 0}
.topbar .mute{font-size:.85rem;margin-right:auto}
.topbar button{min-height:38px;padding:6px 12px;border-radius:999px;font-size:.9rem}
.topbar button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:600}
/* ไอคอน ปุ่มแสดงรหัสผ่าน และตารางสถิติ */
.ic{width:1.15em;height:1.15em;vertical-align:-.2em;flex:0 0 auto}
.feat .ico{width:42px;height:42px;border-radius:12px;background:var(--chip);color:var(--brand);display:flex;align-items:center;justify-content:center;flex:0 0 42px}
.feat .ico .ic{width:22px;height:22px;vertical-align:0}
.pw{position:relative}
.pw input{padding-right:84px}
.pw button{position:absolute;right:4px;top:50%;transform:translateY(-50%);min-height:36px;padding:4px 12px;border:0;background:transparent;color:var(--brand);font-size:.92rem;text-decoration:underline}
.errlist{margin:6px 0 0;padding-left:1.2em}
/* ภาพรวมความก้าวหน้า */
button.sm{min-height:40px;padding:6px 14px;border-radius:12px;font-size:.92rem}
.dash-hero{position:relative;overflow:hidden;background:var(--hero-bg);color:var(--hero-ink);border-radius:26px;padding:20px;margin:0 0 14px;box-shadow:0 8px 22px rgba(75,46,131,.28);display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
.dash-hero::after{content:"";position:absolute;right:-34px;top:-44px;width:150px;height:150px;border-radius:50%;background:rgba(255,212,59,.16);pointer-events:none}
.dash-hero>*{position:relative;z-index:1}
.dash-hero.solo{grid-template-columns:1fr}
.dash-hero .kicker{font-size:.85rem;color:var(--hero-mute)}
.dash-hero .big{font-family:"Prompt","Noto Sans Thai",sans-serif;font-size:2.7rem;line-height:1.05;font-weight:700;display:flex;align-items:center;gap:8px;margin-top:2px}
.dash-hero .big.small{font-size:1.7rem}
.dash-hero .big small{font-size:1rem;font-weight:500;color:var(--hero-mute);align-self:flex-end;margin-bottom:6px}
.dash-hero .big .ic{width:.95em;height:.95em;color:var(--acc)}
.dash-hero .sub{color:var(--hero-mute);margin-top:6px;font-size:.95rem}
.dash-hero .cta{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap}
.dash-hero button.go{background:var(--acc);color:var(--acc-ink);border:0;font-weight:700;box-shadow:0 4px 0 rgba(0,0,0,.28)}
.dash-hero button.go:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.28)}
.dash-hero button.ghost{background:transparent;color:var(--hero-ink);border-color:rgba(255,255,255,.55)}
.ring{width:104px;height:104px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);display:block}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Prompt","Noto Sans Thai",sans-serif;font-weight:700;font-size:1.55rem;line-height:1}
.ring .num small{font-family:"Noto Sans Thai",sans-serif;font-size:.72rem;font-weight:400;color:var(--hero-mute);margin-top:3px}
.rec{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.rec:first-of-type{border-top:0;padding-top:4px}
.rec .ico2{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--chip);color:var(--brand)}
.rec .ico2 .ic{width:22px;height:22px;vertical-align:0}
.rec.fix .ico2{background:var(--warn-bg);color:var(--warn)}
.rec.go .ico2{background:var(--ok-bg);color:var(--ok)}
.rec b{font-family:"Prompt","Noto Sans Thai",sans-serif;font-weight:700}
.rec .act{margin-top:8px}
.delta{display:inline-block;margin-top:2px;font-size:.78rem;border-radius:999px;padding:0 8px}
.delta.up{background:var(--ok-bg);color:var(--ok)}
.delta.dn{background:var(--warn-bg);color:var(--warn)}
.chart{display:block;width:100%;max-width:480px;height:auto;margin:0 auto}
.chart text{fill:var(--mute);font-size:10px;font-family:"Noto Sans Thai",sans-serif}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--mute);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.heat{display:grid;grid-template-rows:repeat(7,auto);grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.heat i{display:block;aspect-ratio:1;border-radius:5px;background:var(--chip)}
.heat i.l1{background:color-mix(in srgb,var(--brand) 35%,var(--chip))}
.heat i.l2{background:color-mix(in srgb,var(--brand) 62%,var(--chip))}
.heat i.l3{background:var(--brand)}
.heat i.fut{visibility:hidden}
.heat i.today{outline:2px solid var(--acc);outline-offset:1px}
.heatkey{display:flex;align-items:center;gap:4px;justify-content:flex-end;font-size:.8rem;color:var(--mute);margin-top:8px}
.heatkey i{display:inline-block;width:14px;height:14px;border-radius:4px;background:var(--chip)}
.heatkey i.l1{background:color-mix(in srgb,var(--brand) 35%,var(--chip))}
.heatkey i.l2{background:color-mix(in srgb,var(--brand) 62%,var(--chip))}
.heatkey i.l3{background:var(--brand)}
.bar>i.weak{background:var(--acc)}
.tag{display:inline-block;font-size:.75rem;border-radius:999px;padding:0 8px;margin-left:6px;background:var(--warn-bg);color:var(--warn)}
.tag.good{background:var(--ok-bg);color:var(--ok)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.steps{margin:0;padding-left:1.3em}
.steps li{margin:6px 0}
@media (prefers-reduced-motion:no-preference){
  .dcard,.dash-hero{animation:rise .45s ease both}
  .bar>i{transform-origin:left;animation:grow .7s ease both}
}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@keyframes grow{from{transform:scaleX(0)}}
/* ปรับให้อ่านง่ายบนมือถือและแท็บเล็ต */
h1,h2,p,li,label,.t,.q,.qitem,.msg{overflow-wrap:anywhere}
button.link{min-height:40px;padding:8px 6px}
.rate button{padding:10px 0;min-width:0}
dialog{max-height:85vh;overflow:auto}
@media (max-width:380px){
  .hero h1{font-size:1.8rem}
  .tabs button{padding:10px 6px;font-size:.92rem}
  .wrap{padding:12px}
  .card{padding:14px}
}

function applyTheme(t){
  if(t==="light"||t==="dark") document.documentElement.dataset.theme=t; else delete document.documentElement.dataset.theme;
  document.querySelectorAll("#theme button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.t===t)));
}
function setTheme(t){
  try{ if(t==="light"||t==="dark") localStorage.setItem(THEME_KEY,t); else localStorage.removeItem(THEME_KEY); }catch(e){}
  applyTheme(t);
}
function getTheme(){
  try{ const v=localStorage.getItem(THEME_KEY); return v==="light"||v==="dark"?v:"auto"; }catch(e){ return "auto"; }
}

/* ===== ตัวช่วย ===== */
function h(tag, props, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(props||{})){
    if(k==="class") e.className=v;
    else if(k.startsWith("on")) e.addEventListener(k.slice(2),v);
    else if(v===true) e.setAttribute(k,"");
    else if(v!==false && v!=null) e.setAttribute(k,v);
  }
  for(const c of kids.flat(Infinity)){ if(c==null||c===false) continue; e.append(c.nodeType?c:document.createTextNode(String(c))); }
  return e;
}
function mount(...nodes){ app.replaceChildren(...nodes.flat(Infinity).filter(Boolean)); window.scrollTo(0,0); }
function msg(kind,text){ return h("div",{class:"msg "+kind,role:kind==="err"?"alert":"status"},text); }
function fmtTime(s){ s=Math.max(0,Math.round(s)); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); }
function fmtDate(iso){ try{return new Date(iso).toLocaleString("th-TH",{dateStyle:"medium",timeStyle:"short"});}catch(e){return "";} }
function uuid(){ return (crypto.randomUUID?crypto.randomUUID():"10000000-1000-4000-8000-100000000000".replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16))); }

   ทุกเหตุการณ์ส่งได้ครั้งเดียวต่อแท็บ ถ้าส่งไม่สำเร็จจะไม่รบกวนการใช้งาน */
const SCREEN = innerWidth<600?"phone":innerWidth<1024?"tablet":"desktop";
let SESSION_KEY=null; const SENT=new Set();
try{
  SESSION_KEY=sessionStorage.getItem("interview-sk");
  if(!SESSION_KEY){ SESSION_KEY=uuid(); sessionStorage.setItem("interview-sk",SESSION_KEY); }
  JSON.parse(sessionStorage.getItem("interview-sent")||"[]").forEach(x=>SENT.add(x));
}catch(e){ SESSION_KEY=SESSION_KEY||uuid(); }
function track(ev){
  if(SENT.has(ev)) return; SENT.add(ev);
  try{ sessionStorage.setItem("interview-sent",JSON.stringify([...SENT])); }catch(e){}
  try{ sb.from("page_events").insert({session_key:SESSION_KEY,event:ev,screen:SCREEN}).then(()=>{},()=>{}); }catch(e){}
}
function errKind(e){
  const m=(e&&e.message)||"";
  if(/Invalid login/i.test(m)) return "wrong";
  if(/Email not confirmed/i.test(m)) return "unconfirmed";
  if(/already registered|already been registered/i.test(m)) return "exists";
  if(/rate limit|too many|security purposes/i.test(m)) return "rate";
  if(/Password should|weak/i.test(m)) return "weak";
  return "other";
}

/* ร่างคำตอบ: เก็บในเครื่องของผู้ใช้เท่านั้น ลบเมื่อบันทึกการซ้อมหรือออกจากระบบ */
const DRAFT_PREFIX="interview-draft:";
const draftKey=qid=>DRAFT_PREFIX+(S.user?S.user.id:"x")+":"+qid;
function loadDraft(qid){ try{ const v=JSON.parse(localStorage.getItem(draftKey(qid))||"null"); return v&&typeof v.t==="string"?v.t:""; }catch(e){ return ""; } }
function saveDraft(qid,text){
  try{
    if(!text.trim()){ localStorage.removeItem(draftKey(qid)); return; }
    localStorage.setItem(draftKey(qid),JSON.stringify({t:text.slice(0,10000),at:Date.now()}));
    const ks=Object.keys(localStorage).filter(k=>k.startsWith(DRAFT_PREFIX));
    if(ks.length>20){
      ks.map(k=>{ let at=0; try{ at=JSON.parse(localStorage.getItem(k)).at||0; }catch(e){} return [k,at]; })
        .sort((a,b)=>a[1]-b[1]).slice(0,ks.length-20).forEach(([k])=>localStorage.removeItem(k));
    }
  }catch(e){}
}
function clearDraft(qid){ try{ localStorage.removeItem(draftKey(qid)); }catch(e){} }
function clearAllDrafts(){ try{ Object.keys(localStorage).filter(k=>k.startsWith(DRAFT_PREFIX)).forEach(k=>localStorage.removeItem(k)); }catch(e){} }

/* ช่องรหัสผ่านพร้อมปุ่มแสดง/ซ่อน */
function pwField(input){
  const btn=h("button",{type:"button","aria-pressed":"false","aria-label":"แสดงรหัสผ่าน"},"แสดง");
  btn.onclick=()=>{
    const show=input.type==="password"; input.type=show?"text":"password";
    btn.textContent=show?"ซ่อน":"แสดง"; btn.setAttribute("aria-pressed",String(show));
    btn.setAttribute("aria-label",show?"ซ่อนรหัสผ่าน":"แสดงรหัสผ่าน");
  };
  return h("div",{class:"pw"},input,btn);
}

function friendly(e, fallback){
  const m=(e&&e.message)||"";
  if(/[ก-๙]/.test(m)) return m;                       // ข้อความไทยจากระบบเราเอง
  if(/Invalid login/i.test(m)) return "อีเมลหรือรหัสผ่านไม่ถูกต้อง ตรวจอีกครั้ง หรือกด “ลืมรหัสผ่าน”";
  if(/Email not confirmed/i.test(m)) return "ยังไม่ได้ยืนยันอีเมล เปิดอีเมลของคุณแล้วกดลิงก์ยืนยันก่อน (ดูในจดหมายขยะด้วย)";
  if(/already registered|already been registered/i.test(m)) return "อีเมลนี้สมัครไว้แล้ว ลองเข้าสู่ระบบ หรือกด “ลืมรหัสผ่าน”";
  if(/rate limit|too many|security purposes/i.test(m)) return "ทำรายการถี่เกินไป กรุณารอสักครู่ (ประมาณ 1 นาที) แล้วลองใหม่";
  if(/Password should|weak/i.test(m)) return "รหัสผ่านง่ายเกินไป ใช้อย่างน้อย 8 ตัวอักษร และไม่ใช้รหัสที่เดาง่าย";
  if(/valid email|invalid.*email/i.test(m)) return "รูปแบบอีเมลไม่ถูกต้อง ตรวจอีกครั้ง";
  if(/fetch|network|Failed to/i.test(m)) return "เชื่อมต่ออินเทอร์เน็ตไม่ได้ ตรวจสัญญาณแล้วลองใหม่";
  if(e && e.code==="42501") return "คุณไม่มีสิทธิ์ทำรายการนี้ ลองออกจากระบบแล้วเข้าใหม่";
  return fallback||"เกิดข้อผิดพลาด ลองอีกครั้ง ถ้ายังไม่ได้ให้ออกจากระบบแล้วเข้าใหม่";
}

/* ===== เส้นทางหลัก ===== */
async function route(){
  try{
    if(S.recovery) return viewRecover();
    const {data:{session}} = await sb.auth.getSession();
    S.user = session ? session.user : null;
    if(!S.user){ const f=S.flash; S.flash=null; return viewAuth("login",f?msg("ok",f):null); }
    const [pr, cs, ad] = await Promise.all([
      sb.from("profiles").select("display_name,education_level").eq("id",S.user.id).maybeSingle(),
      sb.from("consents").select("consent_type").eq("version",TERMS_VERSION).limit(10),
      sb.from("app_admins").select("user_id").maybeSingle()
    ]);
    if(pr.error) throw pr.error; if(cs.error) throw cs.error;
    S.isAdmin = !!(ad && !ad.error && ad.data && ad.data.user_id);
    S.profile = pr.data || {display_name:"ผู้ใช้ใหม่",education_level:null};
    const types=new Set((cs.data||[]).map(r=>r.consent_type));
    if(!(types.has("terms")&&types.has("privacy")) || !S.profile.education_level) return viewGate(types);
    if(!S.cat) await loadCatalog();
    if(S.p) return viewPractice();
    viewHome();
  }catch(e){
    mount(h("div",{class:"card"},h("h1",{},"โหลดไม่สำเร็จ"),msg("err",friendly(e,"โหลดข้อมูลไม่สำเร็จ ตรวจอินเทอร์เน็ตแล้วกดลองใหม่")),
      h("button",{class:"primary",onclick:route},"ลองใหม่")));
  }
}
sb.auth.onAuthStateChange((ev)=>{
  if(ev==="PASSWORD_RECOVERY") S.recovery=true;
  if(ev==="SIGNED_OUT"){ S.user=null; S.cat=null; S.p=null; S.dash=null; S.tab="dash"; S.isAdmin=false; clearAllDrafts(); S.hist={rows:[],done:false,loading:false,open:{}}; }

});

function viewAuth(mode="login", note=null){
  if(mode==="register") track("view_register");
  const em=h("input",{type:"email",id:"em",autocomplete:"email",required:true,placeholder:"name@example.com"});
  const pw=h("input",{type:"password",id:"pw",autocomplete:mode==="login"?"current-password":"new-password",required:true,minlength:"8"});
  const nm=h("input",{type:"text",id:"nm",maxlength:"50",autocomplete:"nickname",placeholder:"ชื่อเล่นหรือชื่อที่อยากให้เรียก"});
  const out=h("div"); if(note) out.append(note);
  const btn=h("button",{class:"primary",type:"submit"},mode==="login"?"เข้าสู่ระบบ":"สมัครใช้งาน");
  const form=h("form",{onsubmit:async(ev)=>{
    ev.preventDefault(); out.replaceChildren();
    const email=em.value.trim(), pass=pw.value;
    if(!email) return out.append(msg("err","กรุณากรอกอีเมล"));
    if(pass.length<8) return out.append(msg("err","รหัสผ่านต้องยาวอย่างน้อย 8 ตัวอักษร"));
    btn.disabled=true;
    try{
      if(mode==="login"){
        track("submit_login");
        const {error}=await sb.auth.signInWithPassword({email,password:pass}); if(error) throw error;
        track("login_ok");
      }else{
        const name=nm.value.trim().slice(0,50);
        if(!name){ btn.disabled=false; return out.append(msg("err","กรุณากรอกชื่อที่แสดง")); }
        track("submit_register");
        const {data,error}=await sb.auth.signUp({email,password:pass,options:{data:{display_name:name},emailRedirectTo:location.origin+location.pathname}});
        if(error) throw error;
        if(data.user && data.user.identities && data.user.identities.length===0) throw new Error("already registered");
        track("register_ok");
        if(!data.session){ btn.disabled=false; return viewAuth("login",msg("ok","สมัครสำเร็จ ส่งอีเมลยืนยันไปที่ "+email+" แล้ว กดลิงก์ในอีเมล (ดูในจดหมายขยะด้วย) จากนั้นกลับมาเข้าสู่ระบบ")); }
      }

      const k=errKind(e);
      track(mode==="login"?"login_err_"+(["wrong","unconfirmed"].includes(k)?k:"other"):"register_err_"+(["exists","weak","rate"].includes(k)?k:"other"));

const GOAL=3, LEVELS=["พื้นฐาน","ปานกลาง","ท้าทาย"];
const dayKey=d=>d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
const num=x=>typeof x==="number"&&isFinite(x);
const avgOf=a=>{ const v=a.filter(num); return v.length?v.reduce((s,x)=>s+x,0)/v.length:null; };

function pickQ(o){
  o=o||{}; const f=S.f, seen=new Set(((S.dash&&S.dash.rows)||[]).map(r=>r.question_id));
  const base=x=>(!f.type||String(x.interview_type_id)===f.type)&&(!f.lang||x.language===f.lang)&&(!o.cat||x.category_id===o.cat);
  let l=S.cat.qs.filter(x=>base(x)&&(!o.level||x.level===o.level));
  if(!l.length) l=S.cat.qs.filter(base);
  if(!l.length) l=S.cat.qs.slice();
  const fresh=l.filter(x=>!seen.has(x.id)), pool=fresh.length?fresh:l;
  return pool[Math.floor(Math.random()*pool.length)];
}
function dashCalc(rows){
  const qm=new Map(S.cat.qs.map(q=>[q.id,q]));
  const list=rows.map(r=>({...r,t:new Date(r.created_at)})).filter(r=>!isNaN(r.t)).sort((a,b)=>a.t-b.t||a.id-b.id);
  const now=new Date(), today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const counts={}; list.forEach(r=>{ const k=dayKey(r.t); counts[k]=(counts[k]||0)+1; });
  const doneToday=!!counts[dayKey(today)];
  let streak=0; const cur=new Date(today); if(!doneToday) cur.setDate(cur.getDate()-1);
  while(counts[dayKey(cur)]){ streak++; cur.setDate(cur.getDate()-1); }
  const widx=(today.getDay()+6)%7, weekStart=new Date(today.getFullYear(),today.getMonth(),today.getDate()-widx);
  const week=list.filter(r=>r.t>=weekStart).length;
  const lt=list.length?list[list.length-1].t:null;
  const daysAway=lt?Math.max(0,Math.round((today-new Date(lt.getFullYear(),lt.getMonth(),lt.getDate()))/864e5)):null;
  const scored=list.filter(r=>num(r.rule_score));
  let delta=null; const k=Math.min(5,Math.floor(scored.length/2));
  if(scored.length>=4 && k>=2) delta=Math.round(avgOf(scored.slice(-k).map(r=>r.rule_score))-avgOf(scored.slice(-2*k,-k).map(r=>r.rule_score)));
  /* คะแนนแยกส่วน: ความยาว 40 / คำสำคัญ 40 / โครงสร้าง 20 */
  const pr=list.filter(r=>r.rule_detail&&r.rule_detail.parts&&num(r.rule_detail.parts.len)&&num(r.rule_detail.parts.kw)&&num(r.rule_detail.parts.st));
  const pct=(key,max)=>{ const a=avgOf(pr.map(r=>r.rule_detail.parts[key]/max*100)); return a==null?null:Math.max(0,Math.min(100,Math.round(a))); };
  const parts=pr.length>=3?[{k:"len",name:"ความยาวคำตอบ",v:pct("len",40)},{k:"kw",name:"การใช้คำสำคัญ",v:pct("kw",40)},{k:"st",name:"โครงสร้างและเหตุผล",v:pct("st",20)}]:[];
  const weakPart=parts.length?parts.slice().sort((a,b)=>a.v-b.v)[0]:null;
  const byCat={}, byLv={};
  scored.forEach(r=>{ const q=qm.get(r.question_id); if(!q) return;
    (byCat[q.category_id]=byCat[q.category_id]||[]).push(r.rule_score); (byLv[q.level]=byLv[q.level]||[]).push(r.rule_score); });
  const catHasQ=new Set(S.cat.qs.map(q=>q.category_id));
  const cats=S.cat.cats.filter(c=>catHasQ.has(c.id)).map(c=>({id:c.id,name:c.name_th,n:(byCat[c.id]||[]).length,avg:avgOf(byCat[c.id]||[])}));
  const levels=LEVELS.map(l=>({name:l,n:(byLv[l]||[]).length,avg:avgOf(byLv[l]||[])}));
  const both=list.filter(r=>num(r.self_score)&&num(r.rule_score));
  const gap=both.length>=3?Math.round(avgOf(both.map(r=>r.self_score*20))-avgOf(both.map(r=>r.rule_score))):null;
  const recent=list.slice(-10);
  const shortN=recent.filter(r=>{ const q=qm.get(r.question_id); const len=r.rule_detail&&num(r.rule_detail.len)?r.rule_detail.len:r.answer_chars; return q&&num(len)&&len<(q.min_chars||150); }).length;
  let worst=null; scored.slice(-30).forEach(r=>{ const q=qm.get(r.question_id); if(q&&r.rule_score<60&&(!worst||r.rule_score<worst.rule_score)) worst={...r,q}; });
  const seen=new Set(list.map(r=>r.question_id).filter(x=>x!=null));
  const seenN=[...seen].filter(id=>qm.has(id)).length;
  return {n:list.length,list,counts,today,doneToday,streak,week,daysAway,scored,delta,parts,weakPart,cats,levels,gap,shortN,worst,seenN,
    totalQ:S.cat.qs.length,minutes:Math.round(list.reduce((s,r)=>s+(num(r.elapsed_seconds)?r.elapsed_seconds:0),0)/60),avg:scored.length?Math.round(avgOf(scored.map(r=>r.rule_score))):null};
}
function dashRecs(d,go){
  const R=[], add=(kind,icon,title,text,btn,fn)=>R.push({kind,icon,title,text,btn,fn});

/* ===== ตรวจกติกา (คำนวณในเครื่อง ไม่ส่งไป AI) ===== */
const norm=s=>s.toLowerCase().replace(/\s+/g,"");
function ruleCheck(q,text){
  const t=text.trim(), n=[...t].length, min=q.min_chars||150, max=q.max_chars||1200, en=q.language==="en";
  let sLen = n<min ? 40*n/min : n<=max ? 40 : 40*Math.max(.5,max/n);
  const kws=q.keywords||[], nt=norm(t);
  const matched=kws.filter(k=>nt.includes(norm(k))), missing=kws.filter(k=>!matched.includes(k));
  const need=Math.max(1,Math.ceil(kws.length*.6));
  const sKw = kws.length? 40*Math.min(1,matched.length/need) : 40;
  const chunks = en ? t.split(/[\n.!?]+/).filter(x=>x.trim().length>=20)
                    : t.split(/[\n.!?\s]+/).filter(x=>x.length>=12);
  const marks = en ? /because|for example|for instance|such as|therefore|so that/i : /เพราะ|เนื่องจาก|ดังนั้น|เช่น|ตัวอย่าง|ทำให้|เพื่อ/;
  const stA = chunks.length>=3?10:chunks.length===2?5:0, stB = marks.test(t)?10:0;
  let score = sLen+sKw+stA+stB, flag="";
  const sh=[]; for(let i=0;i+5<=nt.length;i++) sh.push(nt.slice(i,i+5));
  if(sh.length>20 && new Set(sh).size/sh.length<.5){ score=Math.min(score,20); flag="repeat"; }
  const letters=(t.match(/\p{L}/gu)||[]).length;
  if(n>0 && letters/n<.5){ score=Math.min(score,10); flag="symbols"; }
  score=Math.round(Math.max(0,Math.min(100,score)));
  return {score,n,min,max,matched,missing,flag,parts:{len:Math.round(sLen),kw:Math.round(sKw),st:stA+stB},hasKw:kws.length>0,hasMark:stB>0,chunks:chunks.length};
}
function buildPrompt(q,text){
  if(q.language==="en") return "You are an experienced university admissions interviewer. Evaluate my interview answer.\n\nQuestion:\n"+q.question_text+
   "\n\nAnswering guide (Thai, for your reference):\n"+(q.tip_th||"-")+"\n\nMy answer:\n"+text+
   "\n\nPlease: (1) score it 1-10, (2) list 3 strengths, (3) list 3 specific improvements, (4) fix my English grammar, (5) give a better sample answer of similar length. Keep the feedback short and kind.";
  return "คุณเป็นกรรมการสัมภาษณ์ที่มีประสบการณ์ ช่วยประเมินคำตอบสัมภาษณ์ของฉัน\n\nคำถาม:\n"+q.question_text+

  });
  return [
    H.rows.length===0&&!H.loading?(H.done?h("div",{class:"card"},h("p",{},"ยังไม่มีประวัติ เริ่มซ้อมข้อแรกได้ที่แท็บ “ฝึกตอบ”"),h("button",{class:"primary",onclick:()=>{S.tab="practice";viewHome();}},"ไปเลือกคำถาม")):null):null,
    items,
    H.loading?h("p",{class:"mute"},"กำลังโหลด..."):null,
    !H.done&&H.rows.length>0&&!H.loading?h("button",{onclick:loadHistory},"แสดงเพิ่ม"):null,
    H.err?msg("err",H.err):null];
}
async function loadHistory(){
  const H=S.hist; if(H.loading||H.done) return; H.loading=true; H.err=null; if(S.tab==="history") viewHome();
  let q=sb.from("my_practice_history").select("id,question_snapshot,answer_chars,elapsed_seconds,rule_score,self_score,created_at")
    .order("created_at",{ascending:false}).order("id",{ascending:false}).limit(PAGE+1);
  const last=H.rows[H.rows.length-1];
  if(last) q=q.or('created_at.lt."'+last.created_at+'",and(created_at.eq."'+last.created_at+'",id.lt.'+last.id+')');
  const {data,error}=await q; H.loading=false;
  if(error){ H.err=friendly(error,"โหลดประวัติไม่สำเร็จ กดแท็บ “ประวัติ” อีกครั้ง"); }
  else{ if(data.length>PAGE){H.rows.push(...data.slice(0,PAGE));} else {H.rows.push(...data);H.done=true;} }
  if(S.tab==="history") viewHome();
}
async function toggleAnswer(id){
  const H=S.hist;
  if(H.open[id]){ delete H.open[id]; return viewHome(); }
  H.open[id]={text:null}; viewHome();
  const {data,error}=await sb.from("practice_sessions").select("answer_text").eq("id",id).maybeSingle();
  H.open[id]=error||!data?{err:friendly(error,"เปิดคำตอบไม่ได้ ลองใหม่")}:{text:data.answer_text};
  viewHome();
}
async function delSession(id){
  if(!confirm("ลบการซ้อมนี้ถาวรใช่ไหม? ลบแล้วกู้คืนไม่ได้")) return;
  const {error}=await sb.from("practice_sessions").delete().eq("id",id);
  if(error){ S.hist.err=friendly(error,"ลบไม่สำเร็จ ลองใหม่"); return viewHome(); }
  S.dash=null; S.hist.rows=S.hist.rows.filter(r=>r.id!==id); delete S.hist.open[id]; viewHome();
}

/* ===== สถิติ (เห็นได้เฉพาะผู้ดูแล: ตัวเลขรวม ไม่มีข้อมูลรายบุคคล) ===== */
const EV_ERR = {
  register_err_exists:"สมัครไม่ได้: อีเมลซ้ำ", register_err_weak:"สมัครไม่ได้: รหัสผ่านง่ายไป",
  register_err_rate:"สมัครไม่ได้: ทำถี่เกินไป", register_err_other:"สมัครไม่ได้: สาเหตุอื่น",
  login_err_wrong:"เข้าไม่ได้: อีเมลหรือรหัสผ่านผิด", login_err_unconfirmed:"เข้าไม่ได้: ยังไม่ยืนยันอีเมล",
  login_err_other:"เข้าไม่ได้: สาเหตุอื่น", forgot_password:"กด “ลืมรหัสผ่าน”"
};
const pct=(a,b)=>b>0?Math.round(a/b*100)+"%":"–";
function funnelRows(rows){
  const top=Math.max(1,rows[0][1]);
  return rows.map(([l,v])=>h("div",{style:"margin:10px 0"},
    h("div",{class:"row",style:"justify-content:space-between"},h("span",{},l),h("span",{class:"mute"},v+" ("+pct(v,top)+")")),
    h("div",{class:"bar",role:"img","aria-label":l+" "+v},h("i",{style:"width:"+Math.min(100,v/top*100)+"%"}))));
}
function biggestDrop(rows){
  let best=null;
  for(let i=1;i<rows.length;i++){ const d=rows[i-1][1]-rows[i][1]; if(d>0&&(!best||d>best.d)) best={d,from:rows[i-1][0],to:rows[i][0]}; }
  return best;
}
function tabStats(){
  const sel=h("select",{"aria-label":"ช่วงเวลา",onchange:e=>{S.statsDays=Number(e.target.value);loadAdminStats(S.statsDays);}},
    [7,30,90].map(d=>h("option",{value:String(d),selected:S.statsDays===d},d+" วันล่าสุด")));
  return [h("div",{class:"card"},h("h2",{},"สถิติการใช้งาน"),
    h("p",{class:"mute"},"ตัวเลขรวมเท่านั้น ไม่มีข้อมูลรายบุคคล เห็นได้เฉพาะผู้ดูแลระบบ"),
    sel,h("div",{id:"statsbox",style:"margin-top:12px"},h("p",{class:"mute"},"กำลังโหลด...")))];
}
async function loadAdminStats(days){
  const box=document.getElementById("statsbox"); if(!box) return;
  const {data:j,error}=await sb.rpc("admin_usage_summary",{p_days:days});
  const box2=document.getElementById("statsbox"); if(!box2) return;
  if(error||!j){ box2.replaceChildren(msg("err",friendly(error,"โหลดสถิติไม่สำเร็จ ลองเปลี่ยนช่วงเวลาหรือเข้าสู่ระบบใหม่"))); return; }
  const u=j.users, ev=j.events||{}, e=k=>Number(ev[k]||0);
  const st=(v,l)=>h("div",{class:"stat"},h("b",{},v),h("span",{class:"mute"},l));
  const acc=[["สมัครแล้ว",u.total],["ยืนยันอีเมลแล้ว",u.confirmed],["เข้าสู่ระบบแล้ว",u.signed_in],["ยอมรับเงื่อนไขแล้ว",u.accepted_terms],["บันทึกการซ้อมอย่างน้อย 1 ครั้ง",u.practiced]];
  const pre=[["เข้าเว็บ",e("visit")],["เปิดหน้าสมัคร",e("view_register")],["กดสมัคร",e("submit_register")],["สมัครสำเร็จ",e("register_ok")]];
  const d1=biggestDrop(acc), d2=biggestDrop(pre);
  const errs=Object.entries(EV_ERR).filter(([k])=>e(k)>0);
  box2.replaceChildren(...[
    h("div",{class:"stats"},st(u.total,"ผู้ใช้สะสม"),st(u.new_in_window,"สมัครใหม่ใน "+j.days+" วัน"),st(u.active_in_window,"คนที่ซ้อมใน "+j.days+" วัน"),st(j.sessions.total,"ครั้งที่ซ้อมสะสม")),
    u.unconfirmed_over_1d>0?msg("warn","สมัครแล้วแต่ยังไม่ยืนยันอีเมลเกิน 1 วัน: "+u.unconfirmed_over_1d+" คน (มักติดจดหมายขยะ หรือไม่ได้กลับมา)"):null,
    h("h2",{style:"margin-top:18px"},"คนที่สมัครแล้ว ไปถึงขั้นไหน (สะสมทั้งหมด)"),funnelRows(acc),
    d1?h("p",{class:"mute"},"หายมากที่สุดช่วง “"+d1.from+" → "+d1.to+"” (หาย "+d1.d+" คน)"):null,
    h("h2",{style:"margin-top:18px"},"ก่อนสมัคร (ย้อนหลัง "+j.days+" วัน)"),funnelRows(pre),
    d2?h("p",{class:"mute"},"หายมากที่สุดช่วง “"+d2.from+" → "+d2.to+"” (หาย "+d2.d+" ครั้ง)"):null,
    h("p",{class:"mute"},"หมายเหตุ: นับเป็นแท็บเบราว์เซอร์ ไม่ใช่จำนวนคน คนเดียวเปิดสองแท็บจะนับสองครั้ง ข้อมูลเริ่มนับตั้งแต่เปิดใช้ระบบนับนี้"),
    errs.length?h("div",{},h("h2",{style:"margin-top:18px"},"สมัครหรือเข้าสู่ระบบไม่ผ่านเพราะอะไร"),
      h("ul",{class:"errlist"},errs.map(([k,l])=>h("li",{},l+": "+e(k)+" ครั้ง")))):null,
    j.by_education&&j.by_education.length?h("div",{},h("h2",{style:"margin-top:18px"},"ระดับการศึกษาของผู้ใช้"),
      j.by_education.map(x=>h("span",{class:"chip"},x.level+" "+x.count))):null,
    h("p",{class:"mute",style:"margin-top:14px"},"ซ้อมในช่วง "+j.days+" วัน: "+j.sessions.in_window+" ครั้ง")].flat(Infinity).filter(Boolean));
}

/* ===== ของฉัน ===== */
function tabMe(){
  const nm=h("input",{type:"text",maxlength:"50",value:S.profile.display_name||""});
  const lv=h("select",{},["ม.4","ม.5","ม.6","ปวช.","ปริญญาตรี","ทำงานแล้ว","อื่นๆ"].map(x=>h("option",{value:x,selected:S.profile.education_level===x},x)));
  const out=h("div");
  return [h("div",{class:"card"},h("h2",{},"ข้อมูลของฉัน"),
    h("label",{},"ชื่อที่แสดง"),nm,h("label",{},"ระดับการศึกษา"),lv,
    h("label",{},"อีเมล"),h("div",{class:"mute"},S.user.email),out,
    h("div",{class:"row",style:"margin-top:12px"},h("button",{class:"primary",onclick:async()=>{
      out.replaceChildren(); const name=nm.value.trim();
      if(!name) return out.append(msg("err","ชื่อที่แสดงห้ามว่าง"));
      const {error}=await sb.from("profiles").update({display_name:name.slice(0,50),education_level:lv.value}).eq("id",S.user.id);
      if(error) return out.append(msg("err",friendly(error,"บันทึกไม่สำเร็จ ลองใหม่")));
      S.profile.display_name=name.slice(0,50); S.profile.education_level=lv.value; out.append(msg("ok","บันทึกแล้ว"));
    }},"บันทึก"))),
    submitCard(),
    h("div",{class:"card"},h("h2",{},"เอกสารและความเป็นส่วนตัว"),
      h("button",{onclick:showTerms},"อ่านเงื่อนไขและนโยบาย")),
    h("div",{class:"card"},h("h2",{},"ติดต่อผู้พัฒนาระบบ"),
      h("p",{class:"mute"},"พบปัญหาการใช้งาน หรือมีข้อเสนอแนะ ส่งอีเมลมาได้ที่"),
      h("a",{href:"mailto:"+CONTACT},CONTACT)),
    (()=>{
      const conf=h("input",{type:"text",autocomplete:"off",placeholder:"พิมพ์คำว่า ลบบัญชี","aria-label":"พิมพ์คำว่า ลบบัญชี เพื่อยืนยัน"});
      const out=h("div");
      const btn=h("button",{class:"danger",disabled:true,onclick:async()=>{
        out.replaceChildren();
        if(conf.value.trim()!=="ลบบัญชี") return;
        if(!confirm("ลบบัญชีและข้อมูลทั้งหมดถาวรใช่ไหม? กู้คืนไม่ได้")) return;
        btn.disabled=true;
        const {error}=await sb.rpc("delete_my_account");
        if(error){ btn.disabled=false; return out.append(msg("err",friendly(error,"ลบบัญชีไม่สำเร็จ ลองใหม่อีกครั้ง ถ้ายังไม่ได้ติดต่อผู้พัฒนาที่ "+CONTACT))); }
        S.flash="ลบบัญชีและข้อมูลทั้งหมดของคุณแล้ว ขอบคุณที่ใช้งาน";
        await sb.auth.signOut({scope:"local"});
        S.user=null; route();
      }},"ลบบัญชีของฉัน");
      conf.addEventListener("input",()=>{ btn.disabled=conf.value.trim()!=="ลบบัญชี"; });
      return h("div",{class:"card",style:"border-color:var(--bad)"},h("h2",{style:"color:var(--bad)"},"ลบบัญชี"),
        h("p",{},"ลบบัญชีแล้ว ข้อมูลทั้งหมดของคุณจะหายทันที ได้แก่ ชื่อ ระดับการศึกษา คำตอบ และประวัติการซ้อมทุกครั้ง และกู้คืนไม่ได้"),
        h("label",{},"พิมพ์คำว่า ลบบัญชี เพื่อยืนยัน"),conf,out,h("div",{style:"margin-top:12px"},btn));
    })()];
}
